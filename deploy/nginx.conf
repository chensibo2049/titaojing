# 沉思波 · 体态镜 —— nginx 示例配置
# 把 dist/ 里的全部文件放到 /var/www/titaojing（index.html 在这个目录下）。
# 必须 https：浏览器只在 https 或 localhost 下允许摄像头。
#
# 注意 nginx 的继承规则：某个 location 里一旦写了 add_header，server 级的 add_header 就不再继承，
# 所以下面的 location 里重复写了安全头（用 include 片段也可以）。

server {
    listen 443 ssl http2;
    server_name titaojing.example.com;                 # ← 改成你的域名

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;  # ← 改成你的证书
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    root  /var/www/titaojing;
    index index.html;
    include /etc/nginx/mime.types;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    set $pp "camera=(self), microphone=(self), screen-wake-lock=(self)";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy $pp always;

    # 入口、Service Worker、部署配置：不缓存，保证测试同学拿到新版
    location ~ ^/(index\.html|sw\.js|config\.js|version\.json)?$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Permissions-Policy $pp always;
        try_files $uri /index.html;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 带版本号（?v=构建号）的脚本与样式：长期缓存
    location ~* ^/assets/(app\.bundle\.js|app\.css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # WASM：MIME 必须是 application/wasm（较老的 mime.types 里没有）
    location ~* \.wasm$ {
        types { } default_type application/wasm;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
    }

    # MediaPipe 模型 .task：二进制
    location ~* \.task$ {
        types { } default_type application/octet-stream;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name titaojing.example.com;
    return 301 https://$host$request_uri;
}
