# OpenPodium 独立静态站；不引用其他站点的证书或重复安全 snippet。
server {
    listen 80;
    listen [::]:80;
    server_name openpodium.chensibo.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://openpodium.chensibo.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openpodium.chensibo.cn;
    ssl_certificate /etc/nginx/ssl/openpodium.chensibo.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/openpodium.chensibo.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/static-sites/openpodium/current;
    index index.html;
    access_log /var/log/nginx/openpodium.access.log;
    error_log /var/log/nginx/openpodium.error.log;

    # 此 server 独立定义 MIME，避免旧系统 mime.types 缺少 wasm。
    include /etc/nginx/mime.types;
    types { application/wasm wasm; }
    default_type application/octet-stream;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy 'camera=(self), microphone=(self)' always;
    add_header Strict-Transport-Security 'max-age=15552000' always;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:pem|key|env|log|sqlite|db)$ { deny all; }
    # 对这些未带 hash 的入口每次重新验证；用 expires 保留 server 安全响应头继承。
    location ~* (?:^/$|\.html$|/(?:sw\.js|config\.js|version\.json|manifest\.webmanifest)$) {
        expires -1;
        try_files $uri $uri/ =404;
    }
    # 模型支持 Nginx 原生 Range。禁压缩以保持分段字节和长度稳定。
    location ~* \.(?:task|onnx|data)$ {
        gzip off;
        expires 1d;
        try_files $uri =404;
    }
    # 资源名未内容寻址，不设 immutable 或一年缓存；一小时后重新验证。
    location ~* \.(?:js|css|wasm|png|jpe?g|webp|gif|svg|ico)$ {
        expires 1h;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
