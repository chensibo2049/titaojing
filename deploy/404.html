<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>这一页找不到了 · 沉思波 · 体态镜</title>
  <meta name="theme-color" content="#f3eee4">
  <style>
    :root { --paper:#f3eee4; --paper-soft:#faf7f0; --ink:#1b1712; --ink-soft:#3a342c; --ink-faint:#6f675c; --line:rgba(27,23,18,.12); --cinnabar:#a33b28; --cinnabar-deep:#7c2c1e;
      --serif:"Noto Serif CJK SC","Noto Serif SC","Songti SC","STSong","SimSun",serif; --sans:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.7; letter-spacing:.02em; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
    main { max-width:560px; width:100%; background:var(--paper-soft); border:1px solid var(--line); border-radius:2px; padding:40px 36px; }
    .brand { font-family:var(--serif); font-weight:600; letter-spacing:.08em; color:var(--ink-faint); font-size:14px; }
    h1 { font-family:var(--serif); font-size:28px; margin:14px 0 10px; letter-spacing:.06em; }
    p { color:var(--ink-soft); font-size:15px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; }
    .actions a { display:inline-block; padding:10px 18px; border-radius:2px; text-decoration:none; font-size:15px; border:1px solid var(--cinnabar-deep); color:var(--cinnabar-deep); }
    .actions a.primary { background:var(--cinnabar); border-color:var(--cinnabar); color:#fff; }
    .actions a:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
    .path { margin-top:22px; font-size:12px; color:var(--ink-faint); word-break:break-all; }
  </style>
</head>
<body>
  <main>
    <div class="brand">沉思波 · 体态镜 OpenPodium</div>
    <h1>这一页找不到了</h1>
    <p>链接可能写错了，或者页面已经换了位置。体态镜本身还在，可以直接打开开讲，或者先看看介绍页。</p>
    <div class="actions">
      <a class="primary" id="go-app" href="/titaojing/">打开体态镜</a>
      <a id="go-landing" href="/titaojing/landing/">看介绍页</a>
      <a href="https://github.com/chensibo2049/titaojing">GitHub 仓库</a>
    </div>
    <p class="path" id="path"></p>
  </main>
  <script>
    // GitHub Pages 项目站点挂在 /titaojing/ 下；其他托管（本地、Vercel 等）挂在根目录。
    (function () {
      var base = /^\/titaojing(\/|$)/.test(location.pathname) ? "/titaojing/" : "/";
      document.getElementById("go-app").href = base;
      document.getElementById("go-landing").href = base + "landing/";
      document.getElementById("path").textContent = "没找到：" + location.pathname;
    })();
  </script>
</body>
</html>
